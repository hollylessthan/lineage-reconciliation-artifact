name: Real zero-dependency revision replay (post-protocol)
# Confirmation run after protocol-v1: compile-check the strict zero-dependency dbt events
# from the mining probe, then replay confirmed pairs through DataHub dbt and OpenMetadata
# dbt (override and default) on fresh servers, three repetitions each.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned dbt parsers (no warehouse connections are made)
        run: python -m pip install 'dbt-core>=1.10.6,<1.11' 'dbt-duckdb>=1.10,<1.11' 'dbt-bigquery>=1.10,<1.11' 'dbt-snowflake>=1.10,<1.11' 'dbt-databricks>=1.10,<1.11' 'dbt-postgres>=1.9,<1.11'
      - name: Compile-check strict zero-dependency events
        run: |
          mkdir -p results
          cd scripts && python compile_check_zero_deps.py --mining ../evidence/probes/dbt-history-mining.json \
            --clones /tmp/zero-clones --output ../results/zero-dep-compile-check.json --export ../results/zero-manifests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zero-dep-compile
          path: results/
          retention-days: 90

  datahub:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DATAHUB_VERSION: v1.8.0
      DATAHUB_TOKEN_SERVICE_SALT: disposable-pilot-salt
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: disposable-pilot-signing-key-0123456789
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.refresh-datahub.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zero-dep-compile
          path: results/compile
      - name: Start disposable DataHub
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose -f compose.datahub.yml --profile quickstart-backend up -d --wait --wait-timeout 180 opensearch
          curl --fail -X PUT http://127.0.0.1:9200/_cluster/settings -H 'Content-Type: application/json' --data-binary @ci-opensearch-settings.json
          docker compose -f compose.datahub.yml --profile quickstart-backend up -d --wait --wait-timeout 600 datahub-gms-quickstart
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8080/config > results/server-config.json
      - name: Replay through DataHub dbt (default, Replace)
        run: python scripts/real_revisions.py --manifests results/compile/zero-manifests --server http://127.0.0.1:8080 --output results/dh-zero
      - name: Diagnostics
        if: always()
        run: |
          pip freeze > results/pip-freeze.txt
          rm -rf results/compile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zero-dep-datahub-rep${{ matrix.rep }}
          path: results/
          retention-days: 90
      - if: always()
        run: docker compose -f compose.datahub.yml --profile quickstart-backend down -v

  openmetadata:
    needs: compile
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: pilot
          POSTGRES_PASSWORD: pilot
          POSTGRES_DB: fixture
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pilot -d fixture" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.refresh-openmetadata.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zero-dep-compile
          path: results/compile
      - name: Start disposable OpenMetadata
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker compose -f compose.openmetadata.yml -f compose.openmetadata-pilot.yml up -d --wait --wait-timeout 600 openmetadata-server
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8585/api/v1/system/version > results/server-version.json
      - name: Replay through OpenMetadata dbt, overrideLineage=true (Replace)
        if: ${{ !cancelled() }}
        run: python scripts/real_revisions_om.py --override --manifests results/compile/zero-manifests --server http://127.0.0.1:8585 --output results/om-zero-override
      - name: Replay through OpenMetadata dbt, default (Additive)
        if: ${{ !cancelled() }}
        run: python scripts/real_revisions_om.py --manifests results/compile/zero-manifests --server http://127.0.0.1:8585 --output results/om-zero-default
      - name: Diagnostics
        if: always()
        run: |
          pip freeze > results/pip-freeze.txt
          docker compose -f compose.openmetadata.yml -f compose.openmetadata-pilot.yml logs --no-color openmetadata-server > results/server.log 2>&1
          rm -rf results/compile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: zero-dep-openmetadata-rep${{ matrix.rep }}
          path: results/
          retention-days: 90
      - if: always()
        run: docker compose -f compose.openmetadata.yml -f compose.openmetadata-pilot.yml down -v
